<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b3a"><title>蓮沼パークゴルフ場 スコア</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--g:#0b6b3a;--l:#7fa18f;--p:#edf5ef;--c:#fff9e7;--r:#e11d2e;--b:#1769d2;--i:#17221b;--s:0 10px 28px rgba(0,0,0,.16)}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit}.app{max-width:920px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #c9ddd0;border-radius:20px;padding:14px;margin-bottom:14px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:12px 18px;font-weight:800;cursor:pointer;background:#eef2ef;color:#111;min-height:50px}.btn.green{background:var(--g);color:#fff}.btn.danger{background:#c83f2c;color:#fff}.btn:active{transform:scale(.98)}h1{font-size:clamp(26px,4vw,40px);color:#075c31;margin:16px 0 4px}.subtitle{color:#315f49;margin-bottom:12px}.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.course{background:#fff;border:3px solid;border-radius:18px;padding:12px 8px;font-weight:900;font-size:clamp(17px,2.7vw,26px);cursor:pointer;min-height:106px}.course small{display:block;font-size:.66em;color:#222;margin-top:5px}.course .flower{font-size:34px;display:block;margin-bottom:4px}.course[data-id=A]{color:#0d7c34;border-color:#0d7c34}.course[data-id=B]{color:#e940a5;border-color:#ef9bd1}.course[data-id=C]{color:#d58a00;border-color:#f0aa00}.course[data-id=D]{color:#e85c00;border-color:#f06400}.course.active{box-shadow:0 0 0 4px rgba(11,107,58,.18) inset;background:#f4fbf6}.hint{font-size:clamp(15px,2.2vw,21px);font-weight:700;color:#315f49;margin:8px 0}.table-wrap{overflow:auto;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:690px;background:#fff}th,td{border:2px solid var(--l);text-align:center;height:64px;padding:6px}th{background:var(--p);color:#165b38;font-size:18px}td{font-size:22px}td.score{cursor:pointer;min-width:92px}td.score.filled{background:var(--c)}td.score.birdie{color:var(--r);font-weight:900}td.score.eagle{color:var(--b);font-weight:900}tfoot td{font-weight:900;background:#f3f8f4;font-size:24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.note{font-size:14px;color:#486456;text-align:center;margin-top:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.panel{width:min(430px,96vw);background:#fff;border:2px solid var(--l);border-radius:22px;padding:18px;box-shadow:var(--s);text-align:center}.panel h2{margin:0 0 6px;color:#0a6537}.meta{color:#4e6b5b;margin-bottom:14px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{min-height:62px;border:1px solid #c7cfca;border-radius:14px;background:#fff;font-size:28px;font-weight:800;cursor:pointer}.key.selected{color:var(--r);border-color:#f1a4aa}.navs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.navs button{min-height:54px;border:0;border-radius:14px;font-size:20px;font-weight:800}.prev{color:#1769d2;background:#edf5ff}.close{background:#eee}.next{background:var(--g);color:#fff}.plus-help{margin-top:10px;color:#16643a}.member-grid{display:grid;gap:10px;margin-top:12px}.member-grid input{font-size:20px;padding:12px;border:1px solid #b8cbbf;border-radius:12px;width:100%}@media(max-width:650px){.app{padding:8px}.card{padding:10px;border-radius:16px}.courses{grid-template-columns:repeat(2,1fr)}.top .btn{flex:1}}@media print{body{background:#fff}.top,.courses,.hint,.actions,.note{display:none!important}.app,.card{max-width:none;margin:0;padding:0;border:0}table{min-width:0}th,td{height:42px;font-size:15px}tfoot td{font-size:17px}}
</style></head><body><div class="app"><section class="card"><div class="top"><button id="membersBtn" class="btn">← メンバーへ</button><button id="clearBtn" class="btn danger">第2ゲーム開始<br>スコア全消去</button></div><h1>● 蓮沼パークゴルフ場</h1><div class="subtitle">コースを選択してください</div><div class="courses"><button class="course active" data-id="A"><span class="flower">🌼</span>のぎく<small>（ミドリA）</small></button><button class="course" data-id="B"><span class="flower">🌸</span>ききょう<small>（ピンクB）</small></button><button class="course" data-id="C"><span class="flower">🌻</span>ひまわり<small>（アオC）</small></button><button class="course" data-id="D"><span class="flower">🧡</span>やまゆり<small>（オレンジD）</small></button></div></section><section class="card"><div class="hint">スコアのマスをタップして入力（1〜8、9以上は＋）</div><div class="table-wrap"><table id="scoreTable"><thead><tr id="headRow"></tr></thead><tbody id="bodyRows"></tbody><tfoot><tr id="totalRow"></tr></tfoot></table></div><div class="actions"><button id="membersBtn2" class="btn">メンバー変更</button><button id="printBtn" class="btn">印刷／共有</button></div><div class="note">入力済み＝薄いクリーム色　／　バーディー＝赤文字　／　イーグル以下＝青文字</div></section></div><div id="scoreModal" class="modal"><div class="panel"><h2 id="modalTitle"></h2><div id="modalMeta" class="meta"></div><div class="keys" id="keys"></div><div class="navs"><button class="prev" id="prevBtn">前へ</button><button class="close" id="closeBtn">閉じる</button><button class="next" id="nextBtn">次へ</button></div><div class="plus-help">＋を押すたびに 9、10、11… と増えます</div></div></div><div id="memberModal" class="modal"><div class="panel"><h2>メンバー設定</h2><div class="member-grid" id="memberInputs"></div><div class="actions"><button id="memberCancel" class="btn">閉じる</button><button id="memberSave" class="btn green">決定</button></div></div></div><script>
const courses={A:{pars:[3,4,3,5,5,4,3,3,3],dist:[39,50,37,80,100,77,33,40,44]},B:{pars:[4,3,4,5,3,3,3,4,4],dist:[52,33,50,88,35,36,29,48,45]},C:{pars:[4,3,4,4,3,4,3,3,5],dist:[53,28,55,54,48,73,48,41,100]},D:{pars:[5,3,3,4,4,4,3,3,4],dist:[90,39,34,57,56,55,33,31,55]}};let members=['岡田','石橋','中西','松本'],currentCourse='A',scores={},cursor={hole:0,player:0};const $=id=>document.getElementById(id);function ensure(){if(!scores[currentCourse])scores[currentCourse]=Array.from({length:9},()=>Array(members.length).fill(null));scores[currentCourse]=scores[currentCourse].map(r=>{r=r.slice(0,members.length);while(r.length<members.length)r.push(null);return r})}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){ensure();const c=courses[currentCourse];document.querySelectorAll('.course').forEach(b=>b.classList.toggle('active',b.dataset.id===currentCourse));$('headRow').innerHTML='<th>ホール</th><th>Par</th><th>距離(m)</th>'+members.map(x=>`<th>${esc(x)}</th>`).join('');$('bodyRows').innerHTML='';for(let h=0;h<9;h++){const tr=document.createElement('tr');tr.innerHTML=`<td>${h+1}</td><td>${c.pars[h]}</td><td>${c.dist[h]}</td>`;members.forEach((_,p)=>{const td=document.createElement('td');td.className='score';const v=scores[currentCourse][h][p];if(v!==null){td.textContent=v;td.classList.add('filled');if(v===c.pars[h]-1)td.classList.add('birdie');if(v<=c.pars[h]-2)td.classList.add('eagle')}td.onclick=()=>openScore(h,p);tr.appendChild(td)});$('bodyRows').appendChild(tr)}$('totalRow').innerHTML=`<td>計</td><td>${c.pars.reduce((a,b)=>a+b,0)}</td><td>${c.dist.reduce((a,b)=>a+b,0)}</td>`+members.map((_,p)=>{const v=scores[currentCourse].map(r=>r[p]).filter(v=>v!==null);return `<td>${v.length?v.reduce((a,b)=>a+b,0):'—'}</td>`}).join('')}function openScore(h,p){cursor={hole:h,player:p};const c=courses[currentCourse];$('modalTitle').textContent=`Hole ${h+1}　${members[p]} さん`;$('modalMeta').textContent=`Par ${c.pars[h]} ／ 距離 ${c.dist[h]}m`;renderKeys();$('scoreModal').classList.add('open')}function renderKeys(){$('keys').innerHTML='';for(let n=1;n<=8;n++){const b=document.createElement('button');b.className='key';b.textContent=n;if(scores[currentCourse][cursor.hole][cursor.player]===n)b.classList.add('selected');b.onclick=()=>setScore(n,true);$('keys').appendChild(b)}const plus=document.createElement('button');plus.className='key';plus.textContent='+';plus.onclick=()=>{const old=scores[currentCourse][cursor.hole][cursor.player];setScore(old&&old>=9?old+1:9,false)};$('keys').appendChild(plus)}function setScore(v,a){scores[currentCourse][cursor.hole][cursor.player]=v;render();a?move(1):openScore(cursor.hole,cursor.player)}function move(step){let i=cursor.hole*members.length+cursor.player+step,max=9*members.length;if(i<0)i=0;if(i>=max){closeScore();return}openScore(Math.floor(i/members.length),i%members.length)}function closeScore(){$('scoreModal').classList.remove('open')}function openMembers(){$('memberInputs').innerHTML='';members.forEach((m,i)=>{const x=document.createElement('input');x.value=m;x.placeholder=`プレーヤー${i+1}`;$('memberInputs').appendChild(x)});$('memberModal').classList.add('open')}function closeMembers(){$('memberModal').classList.remove('open')}document.querySelectorAll('.course').forEach(b=>b.onclick=()=>{currentCourse=b.dataset.id;render()});$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('closeBtn').onclick=closeScore;$('scoreModal').onclick=e=>{if(e.target===$('scoreModal'))closeScore()};$('membersBtn').onclick=$('membersBtn2').onclick=openMembers;$('memberCancel').onclick=closeMembers;$('memberSave').onclick=()=>{const vals=[...$('memberInputs').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);if(!vals.length){alert('名前を1人以上入力してください');return}members=vals.slice(0,4);Object.keys(scores).forEach(k=>scores[k]=scores[k].map(r=>{r=r.slice(0,members.length);while(r.length<members.length)r.push(null);return r}));closeMembers();render()};$('clearBtn').onclick=()=>{if(confirm('全コースのスコアを消去しますか？')){scores={};render()}};$('printBtn').onclick=()=>window.print();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
